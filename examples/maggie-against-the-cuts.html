function mkGrid(def) {
  const g = []; for (let y = 0; y < H; y++) g.push(Array(W).fill('.'));
  for (let x = 0; x < W; x++) { g[0][x] = '#'; g[H - 1][x] = '#'; }
  for (let y = 0; y < H; y++) { g[y][0] = '#'; g[y][W - 1] = '#'; }
  for (const [x, y, w, h] of def.walls) for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g[y + j][x + i] = '#';
  for (const [x, y] of def.bushes) g[y][x] = 'b';
  for (const [x, y] of def.slime) g[y][x] = 's';
  return g;
}
function renderStatic(def) {
  const c = document.createElement('canvas'); c.width = VW; c.height = VH;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  drawFloor(g, def.floor, mulberry(def.seed));

  def.walls.forEach(b => drawBlock(g, b));

  def.slime.forEach(([x, y]) => drawSlime(g, x, y));
  if (def.id === 2) {
    const gx = 13 * T, gy = 2 * T, gw = 4 * T, gh = 2 * T;

    g.fillStyle = C.mustard; for (let k = 0; k < gw; k += 8) g.fillRect(gx + k, gy + gh - 4, 4, 4);
    g.fillStyle = '#4d555b'; g.fillRect(gx, gy, gw, 2);

function initParty() { party.t = 0; party.fw = []; party.conf = []; for (let i = 0; i < 70; i++) party.conf.push(mkConf(true)); }
function updParty() {
  party.t++;
  if (party.t % 34 === 1) {
    const x = rand(50, VW - 50), y = rand(24, 90), c = pick(CONF); audio.sfx('pop');
    for (let k = 0; k < 28; k++) { const a = k / 28 * Math.PI * 2, s = rand(1.1, 2.1); party.fw.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 70, c }); }
  }
  for (let i = party.fw.length - 1; i >= 0; i--) { const q = party.fw[i]; q.x += q.vx; q.y += q.vy; q.vy += .03; q.vx *= .985; if (--q.life <= 0) party.fw.splice(i, 1); }
  for (const q of party.conf) { q.x += q.vx + Math.sin(party.t * .05 + q.ph) * .3; q.y += q.vy; if (q.y > VH + 4) Object.assign(q, mkConf(false)); }
}
function drawParty() {
  const g = ctx, t = party.t; g.save();
  const gr = g.createLinearGradient(0, 0, 0, 160); gr.addColorStop(0, '#1d0f2d'); gr.addColorStop(.7, '#7a2e3a'); gr.addColorStop(1, '#d4622a');
  g.fillStyle = gr; g.fillRect(0, 0, VW, VH);
  for (let k = 0; k < 40; k++) if ((t + k * 7) % 60 < 40) R(g, '#f6e9c8', (k * 97) % VW, (k * 53) % 110, 1, 1);
  for (let i = 0; i < 10; i++) {
    const hx = i * 48, h = 40 + ((i * 37) % 24);
    R(g, '#1a1020', hx, 150 - h, 46, h); R(g, '#241530', hx - 2, 150 - h - 6, 50, 6);
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) R(g, (i + r + c + (t >> 5)) % 3 ? C.mustard : '#5a3a28', hx + 6 + c * 13, 150 - h + 6 + r * 14, 8, 8);
  }
  R(g, '#3a2a22', 0, 150, VW, VH - 150); for (let x = 0; x < VW; x += 16) R(g, '#2e211b', x, 150, 1, VH - 150);
  for (let s = 0; s < 2; s++) {
    g.beginPath(); for (let x = 0; x <= VW; x += 8) { const y = 10 + s * 22 + Math.sin(x / VW * Math.PI) * 14 + Math.sin(t * .05 + x * .05) * 1.5; if (x === 0) g.moveTo(x, y); else g.lineTo(x, y); }
    g.strokeStyle = '#d9c9a0'; g.lineWidth = 1; g.stroke();
    for (let x = 12; x < VW; x += 24) { const y = 10 + s * 22 + Math.sin(x / VW * Math.PI) * 14 + Math.sin(t * .05 + x * .05) * 1.5; g.fillStyle = CONF[((x / 24) + s) % CONF.length | 0]; g.beginPath(); g.moveTo(x - 6, y); g.lineTo(x + 6, y); g.lineTo(x, y + 12); g.fill(); }
  }
  party.fw.forEach(q => { g.fillStyle = q.c; g.globalAlpha = Math.min(1, q.life / 30); g.fillRect(q.x | 0, q.y | 0, 2, 2); }); g.globalAlpha = 1;
  const cols = [C.teal, C.avo, C.orange, C.mustard, '#8a5ab0', C.red], fy = 158;
  [[70, 0], [112, 1], [154, 2], [326, 3], [368, 4], [410, 5]].forEach(([x, k]) => {
    const by = Math.abs(Math.sin(t * .09 + k)) * 6;
    g.save(); g.translate(x, fy - by); g.scale(2, 2); g.translate(-x, -fy + by);
    drawWorker(g, { x, y: fy - by - 4, dir: x < 240 ? 1 : -1, frame: t, state: 'picket', color: cols[k] }); g.restore();
  });
  const jump = Math.abs(Math.sin(t * .1)) * 22;
  g.save(); g.translate(240, fy - jump); g.scale(2.4, 2.4); g.translate(-240, -fy + jump);
  drawCat(g, 240, fy - jump - 4, t % 120 < 60 ? 1 : -1, t, true); g.restore();
  party.conf.forEach(q => { g.fillStyle = q.c; g.fillRect(q.x | 0, q.y | 0, 3, 2); });
  g.restore();
}

/* ---------- hud ---------- */
function setHud() {
  const w = world; if (!w) return; const p = w.p;
  let objL = w.def.objL, obj = '', lifeL = 'Tins of tuna', life = '', late = false, tins = true;
  if (w.boss) {
    const tot = w.bosses.reduce((s, b) => s + b.hp, 0); objL = 'Boss: ' + w.def.boss.short; obj = '■'.repeat(tot) + '□'.repeat(Math.max(0, w.bossMax - tot));
  } else if (w.id === 1) obj = w.signs.filter(s => s.done).length + ' / 4';
  else if (w.id === 2) { obj = w.delivered + ' / 6'; lifeL = 'Lorry arrives in'; tins = false; const s = Math.max(0, Math.ceil(w.timer / 60)); life = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); late = s <= 20; }
  else if (w.id === 3) obj = w.got + ' / 5';
  else obj = w.united + ' / 6';
  const tinHtml = tins ? [0, 1, 2].map(i => `<i class="tin${i < p.lives ? '' : ' lost'}"></i>`).join('') : '';
  const pct = Math.round(100 - p.yowlCd / p.yowlMax * 100);
  const key = [w.id, objL, obj, life, tinHtml, pct].join('|'); if (key === hudKey) return; hudKey = key;
  $('hAct').textContent = w.def.name + ' of IV';
  $('hObjL').textContent = objL; $('hObj').textContent = obj; $('hLifeL').textContent = lifeL;
  const L = $('hLife'); L.className = tins ? 'tins' : ''; L.innerHTML = tins ? tinHtml : `<strong class="${late ? 'late' : ''}">${life}</strong>`;
  $('hYowl').style.width = pct + '%'; $('hYowlM').className = 'meter' + (pct < 100 ? ' cool' : '');
}

/* ---------- loop ---------- */
let last = 0, acc = 0; const DT = 1000 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts; acc += Math.min(100, ts - last); last = ts;
  while (acc >= DT) { if (state === 'play') update(); else if (state === 'end') updParty(); acc -= DT; }
  if (state === 'end') drawParty(); else if (world) draw();
}
const fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load("bold 8px 'Courier Prime'"), document.fonts.load("16px 'Alfa Slab One'")]).catch(() => {}) : Promise.resolve();
fontsReady.then(() => {
  title(); requestAnimationFrame(frame);
});
})();
</script>
