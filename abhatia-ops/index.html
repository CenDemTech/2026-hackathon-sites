<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bean Jar</title>
<meta name="description" content="A counting game from the world's pantries: estimate the beans in six jars and learn where each bean is a kitchen staple.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #EFE6D6;
    --paper: #FBF7EE;
    --paper-2: #F3ECDE;
    --line: #DCCFB8;
    --ink: #2B2420;
    --ink-2: #4A3F37;
    --muted: #5E5248;
    --green: #2F4A3A;
    --accent: #A2471F;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'Work Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); }
  a { color: var(--accent); } a:hover { color: #7A3315; }

  .app { max-width: 1280px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header {
    padding: 16px 40px; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 32px; letter-spacing: -0.01em; }
  .tagline { font-size: 14px; color: var(--muted); }
  .pills { display: flex; gap: 12px; align-items: center; }
  .pill { font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
  .pill.dark { background: var(--green); color: #fff; border-color: var(--green); }

  main { flex-grow: 1; display: flex; flex-wrap: wrap; }

  /* The kitchen scene is drawn at a fixed 780x748 and scaled to fit. */
  .scene-wrap { flex: 1 1 520px; max-width: 780px; aspect-ratio: 780 / 748; position: relative; overflow: hidden; }
  .scene { position: absolute; left: 0; top: 0; width: 780px; height: 748px; transform-origin: 0 0; }
  .abs { position: absolute; }

  .card-wrap { flex: 1 1 360px; padding: 24px 40px 24px 0; display: flex; min-width: 0; }
  .card {
    flex-grow: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 32px 34px; box-shadow: 0 16px 30px -22px rgba(60,40,20,0.45);
  }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.1; }
  p { margin: 0; line-height: 1.6; color: var(--ink-2); }
  .scoring { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: 14px; padding: 16px 18px; background: var(--paper-2); border-radius: 4px; }
  .scoring b { font-weight: 600; }

  .btn {
    align-self: flex-start; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px;
    background: var(--green); color: #fff; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { background: #8A9A8F; cursor: not-allowed; }
  .btn:focus-visible, .opt:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  label, .q { font-size: 13px; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  input[type=number] {
    height: 52px; padding: 0 16px; font-family: var(--sans); font-size: 22px; font-weight: 600; color: var(--ink);
    background: #fff; border: 1.5px solid #B9AC96; border-radius: 4px; width: 100%;
  }
  .opt {
    min-height: 46px; padding: 8px 16px; text-align: left; border-radius: 4px; border: 1.5px solid #B9AC96;
    background: #fff; color: var(--ink); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .opt[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { flex: 1 1 100px; padding: 12px 14px; background: var(--paper-2); border-radius: 4px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 600; }
  .stat.dark { background: var(--green); color: #fff; }
  .stat.dark .k { color: #D9E3D4; }
  .rule { height: 1px; background: var(--line); }
  .where { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
  .facts { display: grid; gap: 12px; font-size: 14px; line-height: 1.5; }
  .facts .k { font-size: 12px; font-weight: 600; color: var(--muted); }
  .results { border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row .sub { font-size: 12px; color: var(--muted); }
  .row > div { display: flex; flex-direction: column; }
  .row > div:last-child { align-items: flex-end; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 900px) {
    header { padding: 14px 16px; }
    h1 { font-size: 26px; }
    .scene-wrap { max-width: none; flex-basis: 100%; }
    .card-wrap { padding: 16px; flex-basis: 100%; }
    .card { padding: 24px 20px; }
    h2 { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>The Bean Jar</h1>
      <span class="tagline">A counting game from the world's pantries</span>
    </div>
    <div class="pills">
      <span class="pill">Jar <span id="jar-label">1</span> of 6</span>
      <span class="pill dark">Score <span id="score">0</span></span>
    </div>
  </header>

  <main>
    <section class="scene-wrap" aria-label="Kitchen counter" id="scene-wrap">
      <div class="scene" id="scene">
        <div class="abs" aria-hidden="true" style="left:0;top:0;width:780px;height:604px;background-color:#C9D3BE;background-image:linear-gradient(#EEEBE1 2px,transparent 2px),linear-gradient(90deg,#EEEBE1 2px,transparent 2px);background-size:52px 52px;background-position:-2px -2px"></div>

        <!-- Pantry shelf: small jars that fill in as you learn each bean -->
        <div class="abs" id="pantry" aria-hidden="true" style="left:60px;top:28px;width:660px;height:72px;display:flex;justify-content:space-around;align-items:flex-end"></div>
        <div class="abs" aria-hidden="true" style="left:50px;top:100px;width:680px;height:14px;background:#A87B4F;border-radius:2px;box-shadow:0 6px 10px -6px rgba(60,40,20,0.5)"></div>
        <div class="abs" id="pantry-labels" style="left:60px;top:120px;width:660px;display:flex;justify-content:space-around"></div>

        <!-- Counter top and tea towel -->
        <div class="abs" aria-hidden="true" style="left:0;top:604px;width:780px;height:144px;background-color:#B88A5C;background-image:repeating-linear-gradient(90deg,rgba(90,55,25,0.08) 0 2px,transparent 2px 46px,rgba(255,230,200,0.08) 46px 48px,transparent 48px 97px)"></div>
        <div class="abs" aria-hidden="true" style="left:0;top:600px;width:780px;height:10px;background:#8E6640"></div>
        <div class="abs" aria-hidden="true" style="left:70px;top:608px;width:92px;height:120px;background:#F4EEE2;border-radius:0 0 4px 4px;background-image:linear-gradient(transparent 22px,#B4532A 22px 28px,transparent 28px 36px,#B4532A 36px 40px,transparent 40px)"></div>

        <!-- The big jar -->
        <div class="abs" role="img" id="jar" aria-label="An empty glass jar" style="left:240px;top:200px;width:300px;height:408px">
          <div class="abs" aria-hidden="true" style="left:34px;top:0;width:232px;height:34px;border-radius:8px;background-color:#B87333;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.14) 0 3px,transparent 3px 9px);box-shadow:inset 0 -4px 0 rgba(0,0,0,0.18)"></div>
          <div class="abs" aria-hidden="true" style="left:44px;top:32px;width:212px;height:14px;background:rgba(245,248,242,0.55);border:2px solid rgba(255,255,255,0.8);border-radius:4px"></div>
          <div class="abs" style="left:0;top:42px;width:300px;height:366px;border:3px solid rgba(255,255,255,0.8);background:rgba(236,243,236,0.4);border-radius:54px 54px 44px 44px;box-shadow:0 22px 30px -18px rgba(60,40,20,0.55)">
            <div class="abs" id="beans" style="left:11px;top:22px;width:272px;height:330px;overflow:hidden;border-radius:6px 6px 38px 38px"></div>
            <div class="abs" aria-hidden="true" style="left:24px;top:34px;width:16px;height:270px;border-radius:10px;background:rgba(255,255,255,0.35)"></div>
            <div class="abs" aria-hidden="true" style="right:30px;top:60px;width:6px;height:120px;border-radius:6px;background:rgba(255,255,255,0.28)"></div>
          </div>
        </div>

        <!-- Hanging tag -->
        <div class="abs" aria-hidden="true" style="left:520px;top:238px;width:50px;height:2px;background:#6A5A4A;transform:rotate(18deg);transform-origin:left center"></div>
        <div class="abs" style="left:560px;top:248px;width:168px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px;transform:rotate(5deg);box-shadow:0 8px 14px -8px rgba(60,40,20,0.45)">
          <div id="tag-eyebrow" style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)"></div>
          <div id="tag-title" style="font-family:var(--serif);font-size:22px;line-height:1.15;margin-top:4px"></div>
          <div id="tag-sub" style="font-size:12px;color:var(--muted);margin-top:4px"></div>
        </div>
      </div>
    </section>

    <section class="card-wrap" aria-label="Game card">
      <div class="card" id="card" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  var BEANS = [
    { id: "borlotti", name: "Borlotti", short: "Borlotti", aka: "cranberry bean", region: "Northern Italy (Veneto)",
      tones: ["#EAD9C4", "#E4D0B6"], speckle: "#A3262A", w: 22, h: 15, sx: 19, sy: 13,
      texture: "Cream skins streaked with crimson that fade to soft brown in the pot. Creamy, almost chestnut-like inside.",
      dish: "Pasta e fagioli: beans and small pasta simmered until the broth turns thick and silky.",
      tip: "In late summer, buy them fresh in the pod and shell them like peas. No soaking needed.",
      fact: "The Lamon borlotti from the Belluno valley carry EU protected-origin (PGI) status." },
    { id: "turtle", name: "Black turtle bean", short: "Black", aka: "frijol negro", region: "Mexico, Central America and Brazil",
      tones: ["#1E1A1C", "#2A2426", "#231E20"], w: 15, h: 11, sx: 13, sy: 10,
      texture: "Small, glossy and jet black. Dense, velvety and earthy once cooked.",
      dish: "Feijoada in Brazil; frijoles negros across Mexico, Central America and the Caribbean.",
      tip: "Keep the dark cooking liquid. It thickens soups and gives rice its color.",
      fact: "Their color comes from anthocyanins, the same family of pigments found in blueberries." },
    { id: "adzuki", name: "Adzuki", short: "Adzuki", aka: "azuki, red mung", region: "Japan, China and Korea",
      tones: ["#7E2420", "#8C2D25", "#6E1E1C"], w: 13, h: 10, sx: 12, sy: 9,
      texture: "Tiny, maroon and slightly sweet, with a nutty, almost chestnut flavor.",
      dish: "Anko, sweet red bean paste, folded into dorayaki, taiyaki and mochi; Korean patbingsu.",
      tip: "Small enough to cook without soaking, in about an hour.",
      fact: "In Japan, sekihan (rice steamed with adzuki) is a traditional dish for celebrations." },
    { id: "fava", name: "Fava", short: "Fava", aka: "broad bean, ful", region: "Egypt and the Eastern Mediterranean",
      tones: ["#C9BE8A", "#BDB27B", "#D1C694"], w: 30, h: 22, sx: 27, sy: 19,
      texture: "Large and flat. Grassy when fresh, buttery with a gentle bitterness when dried.",
      dish: "Ful medames: dried favas slow-simmered, mashed and dressed with cumin, lemon and olive oil.",
      tip: "Fresh favas need double-peeling: out of the pod, then slip off each pale skin.",
      fact: "One of the oldest cultivated crops, found at Neolithic sites in the Levant." },
    { id: "rajma", name: "Rajma", short: "Rajma", aka: "red kidney bean", region: "North India (Jammu and Kashmir, Punjab)",
      tones: ["#6B1A1E", "#7A2226", "#5E1619"], w: 22, h: 13, sx: 19, sy: 12,
      texture: "Full-bodied and kidney-shaped. Holds its shape with a soft, creamy center.",
      dish: "Rajma chawal: kidney beans in a spiced onion-tomato gravy, served over rice.",
      tip: "Boil raw kidney beans hard for at least 10 minutes. A slow cooker alone will not break down their natural toxin.",
      fact: "Kidney beans came to India from the Americas, so this comfort classic is only a few centuries old." },
    { id: "tarbais", name: "Tarbais", short: "Tarbais", aka: "haricot tarbais", region: "Hautes-Pyrénées, southwest France",
      tones: ["#F3EEE2", "#ECE5D5"], w: 20, h: 14, sx: 18, sy: 12,
      texture: "Large, ivory and thin-skinned. Melts inside while holding its shape through hours of cooking.",
      dish: "Cassoulet: slow-baked with duck confit, pork and Toulouse sausage.",
      tip: "Traditionally grown climbing up corn stalks, the same pairing used across the Americas.",
      fact: "Carries both France's Label Rouge and an EU protected-origin (PGI) designation." }
  ];

  var state = { phase: "intro", round: 0, seed: 1, jar: [], guessText: "", region: null, options: [], results: [] };

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function rng(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, r) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function total() { return state.results.reduce(function (a, x) { return a + x.roundTotal; }, 0); }

  // ---------- game logic ----------
  function layout(v, r) {
    var W = 272, H = 330;
    var fill = 0.55 + r() * 0.35;
    var rows = Math.floor((H * fill) / v.sy);
    var beans = [];
    for (var row = 0; row < rows; row++) {
      var y0 = H - v.h - 4 - row * v.sy;
      var off = row % 2 ? v.sx / 2 : 0;
      for (var x0 = 3 + off; x0 + v.w <= W - 3; x0 += v.sx) {
        var x = x0 + (r() - 0.5) * v.sx * 0.35;
        var y = y0 + (r() - 0.5) * v.sy * 0.3;
        x = Math.max(2, Math.min(W - v.w - 2, x));
        y = Math.max(2, Math.min(H - v.h - 2, y));
        if (y + v.h > H - 26 && (x < 18 || x + v.w > W - 18)) continue;
        var tone = v.tones[Math.floor(r() * v.tones.length)];
        var bg = tone;
        if (v.speckle) {
          var a = Math.round(20 + r() * 50), b = Math.round(20 + r() * 60);
          bg = "radial-gradient(circle at " + a + "% " + b + "%, " + v.speckle + " 0 2px, transparent 2.5px), " +
               "radial-gradient(circle at " + (100 - a) + "% " + Math.round(90 - b * 0.6) + "%, " + v.speckle + " 0 1.6px, transparent 2px), " +
               "radial-gradient(ellipse at 50% 70%, rgba(163,38,42,0.55) 0 3px, transparent 3.5px), " + tone;
        }
        beans.push({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, w: v.w, h: v.h, r: Math.round((r() - 0.5) * 80), bg: bg });
      }
    }
    return beans;
  }

  function setupRound(round, seed, results) {
    var v = BEANS[round];
    var r = rng(seed + round * 7919);
    var jar = layout(v, r);
    var others = shuffle(BEANS.filter(function (b) { return b.id !== v.id; }).map(function (b) { return b.region; }), r).slice(0, 2);
    var options = shuffle(others.concat([v.region]), r);
    state = { phase: "guess", round: round, seed: seed, jar: jar, guessText: "", region: null, options: options, results: results };
    render(true);
  }

  function startGame() { setupRound(0, Math.floor(Math.random() * 1e9), []); }

  function canSubmit() { return parseInt(state.guessText, 10) > 0 && !!state.region; }

  function submitGuess() {
    if (!canSubmit()) return;
    var g = parseInt(state.guessText, 10);
    var v = BEANS[state.round];
    var actual = state.jar.length;
    var err = Math.abs(g - actual) / actual;
    var pts = 5, verdict = "Keep counting";
    if (err <= 0.03) { pts = 100; verdict = "Bean whisperer"; }
    else if (err <= 0.10) { pts = 75; verdict = "So close"; }
    else if (err <= 0.25) { pts = 45; verdict = "Good eye"; }
    else if (err <= 0.50) { pts = 20; verdict = "In the ballpark"; }
    var regionRight = state.region === v.region;
    var bonus = regionRight ? 25 : 0;
    var regionLine = regionRight
      ? "Right kitchen: +25 bonus for placing it in " + v.region + "."
      : "Not quite: you picked " + state.region + ". This one is a staple in " + v.region + ".";
    state.results = state.results.concat([{ name: v.name, region: v.region, guess: g, actual: actual, roundTotal: pts + bonus, verdict: verdict, regionLine: regionLine }]);
    state.phase = "reveal";
    render(true);
  }

  function nextRound() {
    if (state.round + 1 < BEANS.length) setupRound(state.round + 1, state.seed, state.results);
    else { state.phase = "end"; state.jar = []; render(true); }
  }

  // ---------- drawing ----------
  function renderScene() {
    var s = state, v = BEANS[s.round] || BEANS[0];

    $("jar-label").textContent = s.phase === "intro" ? 1 : (s.phase === "end" ? 6 : s.round + 1);
    $("score").textContent = total();

    var pantry = "", labels = "";
    BEANS.forEach(function (b, i) {
      var learned = i < s.results.length;
      pantry += '<div style="width:84px;display:flex;flex-direction:column;align-items:center">' +
        '<div style="width:34px;height:9px;background:#A86A35;border-radius:3px"></div>' +
        '<div style="width:50px;height:50px;border:2px solid rgba(255,255,255,0.85);background:rgba(250,250,245,0.35);border-radius:12px 12px 9px 9px;position:relative;overflow:hidden">' +
        '<div style="position:absolute;left:0;right:0;bottom:0;height:' + (learned ? 34 : 0) + 'px;background:' + (learned ? b.tones[0] : "transparent") + '"></div>' +
        '</div></div>';
      labels += '<span style="width:84px;text-align:center;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase">' +
        esc(learned ? b.short : "?") + '</span>';
    });
    $("pantry").innerHTML = pantry;
    $("pantry-labels").innerHTML = labels;

    var show = s.phase === "guess" || s.phase === "reveal";
    $("beans").innerHTML = (show ? s.jar : []).map(function (b) {
      return '<div style="position:absolute;left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.h +
        'px;transform:rotate(' + b.r + 'deg);background:' + b.bg +
        ';border-radius:50%;box-shadow:inset -2px -2px 0 rgba(0,0,0,0.2),inset 1.5px 1.5px 0 rgba(255,255,255,0.22),0 0 0 0.6px rgba(60,40,30,0.4)"></div>';
    }).join("");
    $("jar").setAttribute("aria-label", show ? "A glass jar filled with beans" : "An empty glass jar");

    var eyebrow = "Today's game", title = "The Bean Jar", sub = "Six jars to count";
    if (s.phase === "guess") { eyebrow = "Jar No. " + (s.round + 1); title = "Mystery bean"; sub = "Label hidden until you guess"; }
    if (s.phase === "reveal") { eyebrow = "Jar No. " + (s.round + 1); title = v.name; sub = s.jar.length + " beans, counted"; }
    if (s.phase === "end") { eyebrow = "Pantry"; title = "All counted"; sub = "Six regions, six beans"; }
    $("tag-eyebrow").textContent = eyebrow;
    $("tag-title").textContent = title;
    $("tag-sub").textContent = sub;
  }

  function cardIntro() {
    return '<div class="stack">' +
      '<span class="eyebrow">How to play</span>' +
      '<h2>Six jars. Six kitchens. One very full counter.</h2>' +
      '<p style="font-size:15px">Each jar is filled with a single regional bean. Estimate how many are inside, then guess which part of the world cooks with it most. Every reveal stocks a jar on your pantry shelf, along with what to make with it.</p>' +
      '<div class="scoring">' +
        '<span>Within 3%</span><b>100 pts</b>' +
        '<span>Within 10%</span><b>75 pts</b>' +
        '<span>Within 25%</span><b>45 pts</b>' +
        '<span>Within 50%</span><b>20 pts</b>' +
        '<span>Right region</span><b>+25 bonus</b>' +
      '</div>' +
      '<button type="button" class="btn" data-action="start">Open the pantry</button>' +
    '</div>';
  }

  function cardGuess() {
    var s = state;
    var opts = s.options.map(function (o) {
      return '<button type="button" class="opt" data-region="' + esc(o) + '" aria-pressed="' + (s.region === o) + '">' + esc(o) + '</button>';
    }).join("");
    return '<div class="stack">' +
      '<span class="eyebrow">Jar ' + (s.round + 1) + ' of 6</span>' +
      '<h2>How many beans are in the jar?</h2>' +
      '<p style="font-size:14px">Counting tip: count the beans across one row, count the rows up to the fill line, then multiply. The rounded bottom hides a few.</p>' +
      '<div class="field">' +
        '<label for="bean-guess">Your estimate</label>' +
        '<input id="bean-guess" type="number" inputmode="numeric" min="1" placeholder="e.g. 240" value="' + esc(s.guessText) + '">' +
      '</div>' +
      '<div class="field">' +
        '<span id="region-q" class="q">Bonus: where is this bean a kitchen staple?</span>' +
        '<div role="group" aria-labelledby="region-q" class="field">' + opts + '</div>' +
      '</div>' +
      '<button type="button" class="btn" id="submit" data-action="submit"' + (canSubmit() ? "" : " disabled") + '>Lift the lid</button>' +
    '</div>';
  }

  function cardReveal() {
    var s = state, v = BEANS[s.round], last = s.results[s.results.length - 1];
    var fact = function (k, val) { return '<div><div class="k">' + k + '</div><div>' + esc(val) + '</div></div>'; };
    return '<div class="stack" style="gap:16px">' +
      '<div class="stats">' +
        '<div class="stat"><div class="k">You guessed</div><div class="v">' + last.guess + '</div></div>' +
        '<div class="stat"><div class="k">In the jar</div><div class="v">' + last.actual + '</div></div>' +
        '<div class="stat dark"><div class="k">' + esc(last.verdict) + '</div><div class="v">+' + last.roundTotal + '</div></div>' +
      '</div>' +
      '<p style="font-size:13px">' + esc(last.regionLine) + '</p>' +
      '<div class="rule"></div>' +
      '<span class="eyebrow">Pantry note No. ' + (s.round + 1) + '</span>' +
      '<div>' +
        '<h2 style="line-height:1.05">' + esc(v.name) + '</h2>' +
        '<div class="where">' +
          '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>' +
          '<span>' + esc(v.region) + '</span><span style="color:#8A7C6E" aria-hidden="true">·</span><span style="font-style:italic">' + esc(v.aka) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="facts">' +
        fact("Look and texture", v.texture) + fact("Classic dish", v.dish) +
        fact("Kitchen tip", v.tip) + fact("Worth knowing", v.fact) +
      '</div>' +
      '<button type="button" class="btn" data-action="next">' + (s.round + 1 < BEANS.length ? "Next jar" : "See my pantry") + '</button>' +
    '</div>';
  }

  function cardEnd() {
    var t = total();
    var rank = "Bean Apprentice";
    if (t >= 600) rank = "Head of the Pantry";
    else if (t >= 400) rank = "Sous Chef of Legumes";
    else if (t >= 200) rank = "Line Cook with Potential";
    var rows = state.results.map(function (r) {
      return '<div class="row">' +
        '<div><span style="font-weight:600">' + esc(r.name) + '</span><span class="sub">' + esc(r.region) + '</span></div>' +
        '<div><span style="font-weight:600">+' + r.roundTotal + '</span><span class="sub">' + r.guess + ' vs ' + r.actual + '</span></div>' +
      '</div>';
    }).join("");
    return '<div class="stack" style="gap:16px">' +
      '<span class="eyebrow">The pantry is stocked</span>' +
      '<h2>' + esc(rank) + '</h2>' +
      '<div style="font-size:15px;color:var(--ink-2)"><span style="font-size:40px;font-weight:600;color:var(--ink)">' + t + '</span> / 750 points</div>' +
      '<div class="results">' + rows + '</div>' +
      '<button type="button" class="btn" data-action="start">Refill the jars</button>' +
    '</div>';
  }

  // focusFirst: move keyboard focus into the new card after a phase change
  function render(focusFirst) {
    renderScene();
    var card = $("card");
    var html = { intro: cardIntro, guess: cardGuess, reveal: cardReveal, end: cardEnd }[state.phase]();
    card.innerHTML = html;
    if (focusFirst) {
      var target = state.phase === "guess" ? $("bean-guess") : card.querySelector("button");
      if (target && state.phase !== "intro") target.focus({ preventScroll: true });
    }
  }

  // ---------- events (one listener handles every button in the card) ----------
  $("card").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var region = btn.getAttribute("data-region");
    if (region !== null) {
      state.region = region;
      // Update the buttons in place so the typed guess and focus are kept.
      $("card").querySelectorAll(".opt").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
      $("submit").disabled = !canSubmit();
    } else if (action === "start") startGame();
    else if (action === "submit") submitGuess();
    else if (action === "next") nextRound();
  });

  $("card").addEventListener("input", function (e) {
    if (e.target.id !== "bean-guess") return;
    var clean = String(e.target.value).replace(/[^0-9]/g, "").slice(0, 4);
    if (clean !== e.target.value) e.target.value = clean;
    state.guessText = clean;
    $("submit").disabled = !canSubmit();
  });

  $("card").addEventListener("keydown", function (e) {
    if (e.target.id === "bean-guess" && e.key === "Enter") submitGuess();
  });

  // ---------- scale the kitchen scene to fit the screen ----------
  function fitScene() {
    var w = $("scene-wrap").clientWidth;
    $("scene").style.transform = "scale(" + (w / 780) + ")";
  }
  window.addEventListener("resize", fitScene);

  fitScene();
  render(false);
})();
</script>
</body>
</html>
