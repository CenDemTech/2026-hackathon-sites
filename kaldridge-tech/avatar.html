<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clark — Player Character</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FBEFF3; font-family: 'DM Sans', system-ui, sans-serif; color: #2B1630; }
  a { color: #9E2457; } a:hover { color: #2B1630; }
  main { max-width: 560px; margin: 0 auto; box-sizing: border-box; padding: 48px 16px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #9E2457; }
  .portrait { width: min(340px, 80vw); aspect-ratio: 1; border-radius: 50%; background: #FCE4EC; border: 8px solid #C99A2E; box-sizing: border-box; object-fit: cover; }
  h1 { margin: 0; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 48px; line-height: 1; }
  .bio { margin: 0; font-size: 15px; color: #4A2B50; line-height: 1.5; max-width: 400px; }
  hr { margin: 12px 0 0; width: 100%; height: 2px; border: 0; background: #EBD3DD; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #6B4F68; }
  .sizes { display: flex; align-items: flex-end; gap: 28px; }
  .sizes img { border-radius: 50%; background: #FCE4EC; border: solid #C99A2E; box-sizing: border-box; }
  .play { margin-top: 12px; display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 24px; background: #D63A79; color: #FFFFFF; font-weight: 700; text-decoration: none; }
  .play:hover { background: #9E2457; color: #FFFFFF; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Player character</div>
  <img class="portrait" src="clark.svg" alt="Illustrated Clark: black and white dog with big upright ears, a white blaze, pink inner ears and a gold collar with a pink heart charm">
  <h1>Clark</h1>
  <p class="bio">Boutique owner, shop dog, Style Icon in training. Signature look: one ear up, one ear out, gold collar.</p>
  <hr>
  <div class="label">In-game sizes</div>
  <div class="sizes">
    <img src="clark.svg" alt="" style="width:110px;height:110px;border-width:5px">
    <img src="clark.svg" alt="" style="width:76px;height:76px;border-width:4px">
    <img src="clark.svg" alt="" style="width:52px;height:52px;border-width:3px">
  </div>
  <a class="play" href="./">Play Clark's Closet Dash</a>
</main>
</body>
</html>
