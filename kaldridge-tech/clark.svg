  <path d="M52 92 L40 18 L92 62 Z" fill="#1E1A1D"/>
  <path d="M58 80 L50 34 L83 62 Z" fill="#F5A3BE"/>
  <path d="M148 92 L170 30 L112 62 Z" fill="#1E1A1D"/>
  <path d="M142 80 L160 44 L120 63 Z" fill="#F5A3BE"/>
