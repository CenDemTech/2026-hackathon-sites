<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;700;800&amp;display=swap">
<style>
  body { margin: 0; background: #fdf6e3; }
  a { color: #2b4c7e; }
  a:hover { color: #1a2f4f; }

  main {
    min-height: 100vh;
    box-sizing: border-box;
    padding: 48px 16px 64px;
    background: #fdf6e3;
    font-family: 'Inter', system-ui, sans-serif;
    color: #1b1b1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  figure {
    margin: 0;
    width: 100%;
    max-width: 640px;
    position: relative;
    border: 6px solid #1b1b1f;
    border-radius: 4px;
    overflow: hidden;
    background: #cfd8dc;
  }

  figure svg { display: block; width: 100%; height: auto; }

  figcaption {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    pointer-events: none;
    font-family: 'Anton', Impact, sans-serif;
    font-size: clamp(22px, 6vw, 40px);
    line-height: 1.05;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-align: center;
    color: #ffffff;
    text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
                 0 3px 0 #000, 0 -3px 0 #000, 3px 0 0 #000, -3px 0 0 #000;
  }

  h1 {
    margin: 0;
    font-size: clamp(48px, 10vw, 112px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <figure>
    <svg viewBox="0 0 400 300" role="img" aria-label="Cartoon orange tabby cat fast asleep on a cushion">
      <rect x="0" y="0" width="400" height="210" fill="#d7e3ea"></rect>
      <rect x="0" y="210" width="400" height="90" fill="#b08968"></rect>
      <rect x="290" y="40" width="80" height="100" fill="#f1f5f8" stroke="#9fb3c0" stroke-width="4"></rect>
      <line x1="330" y1="40" x2="330" y2="140" stroke="#9fb3c0" stroke-width="4"></line>
      <line x1="290" y1="90" x2="370" y2="90" stroke="#9fb3c0" stroke-width="4"></line>
      <ellipse cx="200" cy="238" rx="160" ry="34" fill="#5b7db1"></ellipse>
      <ellipse cx="200" cy="230" rx="150" ry="26" fill="#7396cc"></ellipse>
      <path d="M300 215 C350 210 360 180 335 170 C320 165 315 180 330 185" fill="none" stroke="#e08a3c" stroke-width="16" stroke-linecap="round"></path>
      <ellipse cx="215" cy="205" rx="105" ry="40" fill="#f4a259"></ellipse>
      <path d="M190 168 q8 20 0 40 M220 166 q8 22 0 44 M250 170 q8 20 0 38" fill="none" stroke="#d9822b" stroke-width="7" stroke-linecap="round"></path>
      <ellipse cx="150" cy="232" rx="30" ry="11" fill="#f8c08a"></ellipse>
      <polygon points="78,160 86,118 112,148" fill="#f4a259"></polygon>
      <polygon points="84,154 89,128 104,147" fill="#f7b7a3"></polygon>
      <polygon points="128,146 152,116 158,158" fill="#f4a259"></polygon>
      <polygon points="134,147 150,126 153,153" fill="#f7b7a3"></polygon>
      <circle cx="118" cy="190" r="44" fill="#f4a259"></circle>
      <path d="M100 186 q8 7 16 0" fill="none" stroke="#1b1b1f" stroke-width="3.5" stroke-linecap="round"></path>
      <path d="M128 184 q8 7 16 0" fill="none" stroke="#1b1b1f" stroke-width="3.5" stroke-linecap="round"></path>
      <path d="M118 198 l-5 -4 h10 z" fill="#d6665a"></path>
      <path d="M118 199 q-5 7 -10 3 M118 199 q5 7 10 3" fill="none" stroke="#1b1b1f" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M92 200 h-24 M92 206 l-22 5 M146 198 h24 M146 204 l22 5" stroke="#1b1b1f" stroke-width="1.8" stroke-linecap="round"></path>
      <text x="168" y="140" font-family="Anton, Impact, sans-serif" font-size="22" fill="#5b7db1">z</text>
      <text x="184" y="118" font-family="Anton, Impact, sans-serif" font-size="30" fill="#5b7db1">z</text>
      <text x="206" y="90" font-family="Anton, Impact, sans-serif" font-size="40" fill="#5b7db1">Z</text>
    </svg>
    <figcaption>
      <span>I am not sleeping</span>
      <span>I am in power-saving mode</span>
    </figcaption>
  </figure>
  <h1>Hello World</h1>
</main>
</body>
</html>
